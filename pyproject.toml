[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-bridge"
version = "1.0.0"
description = "Secure multi-provider AI model bridge"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
